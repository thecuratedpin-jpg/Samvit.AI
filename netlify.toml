[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # Regular (Node) functions directory — auth, status, memory, conversations,
  # projects, missions, analytics.
  directory = "netlify/functions"

# Edge functions (chat, council, workflow) live in netlify/edge-functions/
# (Netlify's default location) and each declares its own route inline via
# `export const config = { path: "/api/..." }` in the function file itself —
# that's the current recommended pattern, so no [[edge_functions]] blocks are
# needed here. Declaring the same route both ways can register it twice.

# Basic security headers for the static frontend. This does not replace
# the ACCESS_CODE / SESSION_SECRET gate — see README.md.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# These strings are field labels, not default secret values.
[template.environment]
  ACCESS_CODE = "Choose a private registration invitation code"
  SAMVIT_AUTO_SECRETS = "Enter true to generate and persist session and encryption secrets automatically"
